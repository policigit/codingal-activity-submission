<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Job Application Form</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <form>

        <fieldset>
            <legend>Job Application Details:</legend>

            <label>Applicant Name:</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Email Address:</label><br>
            <input type="text"><br><br>

            <label>Experience Level:</label><br>
            <input type="radio" name="experience"> Fresher<br>
            <input type="radio" name="experience"> Experienced<br><br>

            <label>Available Start Date:</label><br>
            <input type="date"><br><br>

        </fieldset>

    </form>

</body>

</html>
