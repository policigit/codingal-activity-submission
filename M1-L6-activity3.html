<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Expense Calculator</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <fieldset>
        <legend><b>Enter Your Daily Expenses</b></legend>

        <form action="/action_page.php"
              oninput="x.value = (parseInt(e1.value || 0) + parseInt(e2.value || 0) + parseInt(e3.value || 0))">

            <label>Name:</label><br>
            <input type="text" id="name"><br><br>

            <label>Expense 1:</label><br>
            <select>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
            </select>
            <input type="number" id="e1" name="e1"><br><br>

            <label>Expense 2:</label><br>
            <select>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
            </select>
            <input type="number" id="e2" name="e2"><br><br>

            <label>Expense 3:</label><br>
            <select>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
            </select>
            <input type="number" id="e3" name="e3"><br><br>

            Total Expense: 
            <output name="x" for="e1 e2 e3"></output>

        </form>

    </fieldset>

</body>

</html>
