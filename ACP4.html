<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>School Media Page</title>
</head>

<body>

    <h1>ABC Public School</h1>

    <p>Welcome to our school webpage. Here you can explore different media elements.</p>

    <!-- Image Section -->
    <h2>School Image</h2>
    <img src="school.jpg" alt="School Image" width="400">

    <!-- Audio Section -->
    <h2>School Anthem</h2>
    <audio controls>
        <source src="anthem.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Video Section -->
    <h2>School Tour Video</h2>
    <video width="400" controls>
        <source src="school-tour.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Embedded GIF -->
    <h2>Fun Activity</h2>
    <embed src="school-fun.gif" type="image/gif">

</body>

</html>
