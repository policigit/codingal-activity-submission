<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form>

        <fieldset>
            <legend><b>Personal Details</b></legend>

            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

            <label>Password:</label><br>
            <input type="password"><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" placeholder="Enter phone number"><br><br>

            <label>Date of Birth:</label><br>
            <input type="date"><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender"> Male<br>
            <input type="radio" name="gender"> Female<br>
            <input type="radio" name="gender"> Other<br><br>

        </fieldset>

        <fieldset>
            <legend><b>Address Details</b></legend>

            <label>Address:</label><br>
            <textarea rows="3" cols="30" placeholder="Enter your address"></textarea><br><br>

            <label>City:</label><br>
            <input type="text"><br><br>

            <label>State:</label><br>
            <input type="text"><br><br>

            <label>Pin Code:</label><br>
            <input type="number"><br><br>

        </fieldset>

        <fieldset>
            <legend><b>Other Information</b></legend>

            <label>Hobbies:</label><br>
            <input type="checkbox"> Reading<br>
            <input type="checkbox"> Sports<br>
            <input type="checkbox"> Music<br><br>

            <label>Select Course:</label><br>
            <select>
                <option>BCA</option>
                <option>BSc</option>
                <option>MCA</option>
                <option>BTech</option>
            </select><br><br>

            <label>Upload Photo:</label><br>
            <input type="file"><br><br>

        </fieldset>

        <br>
        <input type="submit" value="Register">

    </form>

</body>

</html>
