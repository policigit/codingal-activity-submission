<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Registration Form</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <h1>Event Registration Form</h1>

    <form>

        <label>Participant Name:</label><br>
        <input type="text"><br><br>

        <label>Email Address:</label><br>
        <input type="text"><br><br>

        <label>Event Passcode:</label><br>
        <input type="password"><br><br>

        <label>Participation Type:</label><br>
        <input type="radio" name="type"> Solo<br>
        <input type="radio" name="type"> Team<br><br>

        <label>Select Event:</label><br>
        <input type="checkbox"> Coding Contest<br>
        <input type="checkbox"> Hackathon<br><br>

        <input type="submit" value="Register">

    </form>

</body>

</html>
